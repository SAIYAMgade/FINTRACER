[project]
name = "resolvex-backend"
version = "1.0.0"
description = "RESOLVEX Financial Services Investigation and Analytics Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.5.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
